# ======================================================================
#   PRISM — Signal Hound SA124B Dashboard
#   Deployment multi-platform dengan Docker Compose
#
#   Mode dasar:      docker compose up -d
#   Dengan HTTPS:    docker compose --profile proxy up -d
# ======================================================================

services:
  prism:
    build:
      context: .
      dockerfile: Dockerfile
    image: prism:latest
    container_name: prism-app
    restart: unless-stopped

    ports:
      # Port host = SA_PORT (default 3487) → port container = SA_PORT.
      # Dipakai agar mudah ditaruh di belakang reverse proxy (Caddy/nginx):
      # proxy meneruskan ke prism:3487, host mengekspos 3487.
      - "${SA_PORT:-3487}:${SA_PORT:-3487}"

    environment:
      SA_HOST: "0.0.0.0"
      # Port listen di dalam container. SAMA dengan bagian kanan pemetaan di
      # atas, jadi satu nilai SA_PORT mengatur host maupun container — tidak
      # ada drift "port sudah dipakai" bila operator mengganti port di .env.
      SA_PORT: "${SA_PORT:-3487}"
      SA_SIMULATE: "${SA_SIMULATE:-false}"
      SA_DEVICE_SERIAL: "${SA_DEVICE_SERIAL:-}"
      SA_ENABLE_DOCS: "${SA_ENABLE_DOCS:-false}"
      SA_LOG_LEVEL: "${SA_LOG_LEVEL:-INFO}"

      # Keamanan — isi SECRET_KEY di produksi agar sesi tidak gugur saat restart
      SECRET_KEY: "${SECRET_KEY:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SA_TOKEN_TTL_MINUTES: "${SA_TOKEN_TTL_MINUTES:-720}"
      SA_LOGIN_RATE_LIMIT: "${SA_LOGIN_RATE_LIMIT:-5}"
      SA_LOGIN_RATE_WINDOW_SEC: "${SA_LOGIN_RATE_WINDOW_SEC:-60}"

      # Honori header X-Forwarded-For dari reverse proxy. Wajib true saat
      # diakses lewat Caddy/nginx/Cloudflare agar pencatatan audit dan
      # pembatasan laju login mencatat IP klien asli, bukan IP proxy.
      SA_TRUSTED_PROXY: "${SA_TRUSTED_PROXY:-true}"

      # Ambang batas okupansi & perekaman
      SA_THRESHOLD_MODE: "${SA_THRESHOLD_MODE:-adaptive}"
      SA_ADAPTIVE_OFFSET_DB: "${SA_ADAPTIVE_OFFSET_DB:-10.0}"
      SA_FIXED_THRESHOLD_DBM: "${SA_FIXED_THRESHOLD_DBM:--85.0}"
      SA_DWELL_SEC: "${SA_DWELL_SEC:-12.0}"
      SA_MAX_RECORDING_SEC: "${SA_MAX_RECORDING_SEC:-30.0}"
      SA_HANG_TIME_SEC: "${SA_HANG_TIME_SEC:-2.0}"

    volumes:
      # Data persisten: kredensial, statistik okupansi, jadwal, konfigurasi
      - ./data:/app/data
      - ./recordings:/app/recordings
      - ./reports:/app/reports
      - ./logs:/app/logs

    # Healthcheck dinamis: membaca port langsung dari SA_PORT container.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${SA_PORT:-3487}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    # Tingkatkan batas file descriptor untuk ribuan stream WebSocket spektrum & audio
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # --------------------------------------------------------------------
  # Reverse Proxy Caddy (opsional, profil `proxy`)
  # HTTPS otomatis via Let's Encrypt, kompresi zstd/gzip, WebSocket
  # transparan. Diperlukan saat dashboard diekspos ke internet publik.
  # Jalankan: docker compose --profile proxy up -d
  # --------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: prism-caddy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      prism:
        condition: service_healthy

  # --------------------------------------------------------------------
  # Cloudflare Tunnel (opsional, profil `tunnel`)
  # Solusi termudah untuk stasiun pemantau radio di lapangan yang memakai
  # modem seluler 4G/LTE atau Starlink di balik CGNAT (tanpa IP publik).
  # Cukup isi TUNNEL_TOKEN di .env lalu jalankan:
  #   ./deploy.sh --tunnel  atau  docker compose --profile tunnel up -d
  # --------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: prism-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    depends_on:
      prism:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
